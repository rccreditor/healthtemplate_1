<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Organic Wellness Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url('bg1.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
            padding: 20px;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.8) 0%, rgba(56, 142, 60, 0.8) 100%);
            z-index: 1;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 50px 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-header p {
            color: var(--text-light);
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-color);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            transition: var(--transition);
            background: rgba(255, 255, 255, 0.9);
            color: var(--text-color);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
            color: var(--text-color);
        }

        .form-group input::placeholder {
            color: #999;
        }

        .form-group input[type="password"] {
            color: var(--text-color) !important;
            -webkit-text-security: none;
        }

        .form-group input[type="password"]::placeholder {
            color: #999;
        }

        .form-group .input-icon {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-group .input-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-dark);
            font-size: 1.25rem;
            opacity: 1;
            z-index: 2;
            transition: var(--transition);
            height: 1em;
            line-height: 1;
        }

        .form-group .input-icon:hover i,
        .form-group .input-icon:focus-within i {
            color: var(--accent-color);
            opacity: 1;
        }

        .form-group .input-icon input {
            padding-left: 44px;
            height: 48px;
            line-height: 48px;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .remember-me input[type="checkbox"] {
            width: auto;
            margin: 0;
        }

        .remember-me label {
            margin: 0;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .forgot-password {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            background: var(--gradient-primary);
            color: var(--white);
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 25px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            background: rgba(255, 255, 255, 0.95);
            padding: 0 15px;
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .social-login {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .social-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            color: var(--text-color);
            text-decoration: none;
            text-align: center;
            font-weight: 500;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .social-btn:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .signup-link {
            text-align: center;
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .signup-link a {
            color: var(--primary-color);
            font-weight: 600;
            text-decoration: none;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .back-home {
            position: absolute;
            top: 30px;
            left: 30px;
            color: var(--white);
            text-decoration: none;
            font-weight: 600;
            z-index: 3;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }

        .back-home:hover {
            transform: translateX(-5px);
        }

        @media (max-width: 576px) {
            .login-card {
                padding: 40px 30px;
                margin: 20px;
            }

            .login-header h1 {
                font-size: 2rem;
            }

            .social-login {
                flex-direction: column;
            }

            .back-home {
                top: 20px;
                left: 20px;
            }
        }

        .password-toggle {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--accent-color);
            cursor: pointer;
            font-size: 1.25rem;
            z-index: 3;
            padding: 0 4px;
            display: flex;
            align-items: center;
            height: 32px;
        }
        .password-toggle:focus {
            outline: none;
        }
        .password-toggle:hover i {
            color: var(--primary-dark);
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-home">
        <i class="fas fa-arrow-left"></i>
        Back to Home
    </a>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Welcome Back</h1>
                <p>Sign in to your Organic Wellness Hub account</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        <button type="button" class="password-toggle" onclick="togglePasswordLogin()">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="remember-forgot">
                    <div class="remember-me">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn">Sign In</button>
            </form>

           <!-- Inside the <body> section -->
<div class="divider">
    <span>Or sign up with</span>
  </div>
  
  <div class="social-signup">
    <div id="g_id_onload"
         data-client_id="388092658593-u84gd2dnfc4bcht04hng1bh84k47ck6j.apps.googleusercontent.com"
         data-context="signup"
         data-callback="handleGoogleSignIn"
         data-auto_prompt="false">
    </div>
    <div class="g_id_signin"
         data-type="standard"
         data-size="large"
         data-theme="outline"
         data-text="signup_with"
         data-shape="rectangular"
         data-logo_alignment="left">
    </div>
  </div>

            <div class="signup-link">
                Don't have an account? <a href="signup.html">Sign up here</a>
            </div>
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        // Email/Password login (optional fallback)
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value.trim();
    
          try {
            const res = await fetch("https://healthtemplate-1.onrender.com/api/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password })
            });
    
            const data = await res.json();
            if (res.ok) {
              localStorage.setItem("loggedInUser", JSON.stringify(data.user));
              window.location.href = data.user.isAdmin ? "admin_dashboard.html" : "dashboard.html";
            } else {
              alert(data.message || "Login failed. Please check your credentials.");
            }
          } catch (err) {
            alert("Something went wrong: " + err.message);
          }
        });
    
        // Toggle password visibility
        function togglePasswordLogin() {
          const passwordInput = document.getElementById("password");
          const icon = document.querySelector(".password-toggle i");
    
          if (passwordInput.type === "password") {
            passwordInput.type = "text";
            icon.classList.replace("fa-eye", "fa-eye-slash");
          } else {
            passwordInput.type = "password";
            icon.classList.replace("fa-eye-slash", "fa-eye");
          }
        }
    
        // Google Sign-In with custom button
        window.onload = function () {
          google.accounts.id.initialize({
            client_id: "http://388092658593-u84gd2dnfc4bcht04hng1bh84k47ck6j.apps.googleusercontent.com",
            callback: handleGoogleCredential
          });
    
          document.getElementById("googleCustomBtn").addEventListener("click", () => {
            google.accounts.id.prompt(); // triggers the One Tap or popup
          });
        };
    
        async function handleGoogleCredential(response) {
          try {
            const res = await fetch("https://healthtemplate-1.onrender.com/api/google-auth", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ credential: response.credential })
            });
    
            const data = await res.json();
            if (res.ok) {
              localStorage.setItem("loggedInUser", JSON.stringify(data.user));
              window.location.href = "dashboard.html";
            } else {
              alert(data.msg || "Google login failed.");
            }
          } catch (err) {
            alert("Google auth error: " + err.message);
          }
        }

        function handleGoogleSignIn(response) {
    const jwt = response.credential;
    fetch("https://healthtemplate-1.onrender.com/api/auth/google", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: jwt })
    })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        localStorage.setItem("loggedInUser", JSON.stringify({
          name: data.user.name,
          email: data.user.email,
          avatar: data.user.avatar || "https://img.freepik.com/free-vector/smiling-young-man-illustration_1308-174669.jpg"
        }));
        window.location.href = "dashboard.html";
      } else {
        alert(data.message || "Google signup failed.");
      }
    })
    .catch(err => alert("Error: " + err.message));
  }
      </script>
    


</body>
</html>
